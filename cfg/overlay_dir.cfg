# overlay_dir.cfg - ld65 config for the dir overlay (tardis, backlog #4).
#
# Unlike the single-page asm overlays (overlay.cfg), this links cc65-compiled
# C as a standalone multi-page overlay running from user RAM:
#
#   $8800-$9CFF  code + rodata + data (in the file; loaded by the fetch loop)
#   $9D00-$9EFF  bss (not in the file; the overlay zeroes/initializes its own
#                state at entry -- nothing else will, and a cached overlay
#                re-runs with whatever the last run left)
#   $9F00-$9FFF  the overlay's C stack (crt0 points sp at $A000)
#   $40-$5F      the overlay's cc65 zeropage block, disjoint from the shell's
#                ($02-$1F) so calling into the overlay doesn't trample the
#                shell's C state ($20-$3F kept free for future shell use)
#
# The text buffer ($0800-$7FFF) and clipboard ($8000-$87FF) are fixed regions
# the editor addresses via absolute pointers; they're not link-time objects.
MEMORY {
    ZP:     file = "", start = $0040, size = $0020, type = rw, define = yes;
    OVL:    file = %O, start = $8800, size = $1500, define = yes;
    OVLBSS: file = "", start = $9D00, size = $0200, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    CODE:     load = OVL,    type = ro;
    RODATA:   load = OVL,    type = ro, optional = yes;
    DATA:     load = OVL,    type = rw, optional = yes;
    BSS:      load = OVLBSS, type = bss, optional = yes;
}

SYMBOLS {
    # shell-services table entries (src/svc.s) at their fixed addresses.
    _svc_iec_set_fa:                   type = export, value = $FF80;
    _svc_iec_set_sa:                   type = export, value = $FF83;
    _svc_iec_setname:                  type = export, value = $FF86;
    _svc_iec_open:                     type = export, value = $FF89;
    _svc_iec_status:                   type = export, value = $FF8C;
    _svc_iec_chkin:                    type = export, value = $FF8F;
    _svc_iec_getbyte:                  type = export, value = $FF92;
    _svc_iec_close:                    type = export, value = $FF95;
    _svc_iec_clrchn:                   type = export, value = $FF98;
    _svc_fastload_set_device:          type = export, value = $FF9B;
    _svc_fastload_epyx_capable:        type = export, value = $FF9E;
    _svc_fastload_epyx_install:        type = export, value = $FFA1;
    _svc_fastload_epyx_send_dir_header: type = export, value = $FFA4;
    _svc_fastload_epyx_mark_unsupported: type = export, value = $FFA7;
    _svc_epyx_wait_ready:              type = export, value = $FFAA;
    _svc_epyx_recv_byte:               type = export, value = $FFAD;
}
