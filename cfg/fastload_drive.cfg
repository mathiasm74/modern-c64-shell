# fastload_drive.cfg -- ld65 config for the drive-side fast-loader code.
#
# Produces build/fastload_drive.bin, a raw 6502 image that the host uploads
# into the 1541's RAM via M-W. Origin = $0500 (the start of the 1541's
# free buffer space; buffer #0 at $0300-$03FF is left for stock DOS).
#
# Size cap = $0300 (= the rest of the drive's RAM through $07FF). The
# actual drive code will be far smaller -- a typical 2-bit fast loader is
# ~150-250 bytes. The fill = no keeps the binary tight; the host
# uploads only the bytes that exist, not 768 bytes of $00 padding.

MEMORY {
    DRIVE: file = "%O", start = $0500, size = $0300, type = ro, fill = no;
}

SEGMENTS {
    DRIVE_CODE: load = DRIVE, type = ro;
}
