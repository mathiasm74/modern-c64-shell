# bank.cfg - ld65 config for a swappable BASIC-half ROM bank (ROM-expansion PoC).
#
# See docs/ROM-EXPANSION.md (Option A). A bank is an 8KB ROM image served at
# $A000-$BFFF in place of the base set's BASIC half. The base set's KERNAL half
# ($E000-$FFFF) is byte-identical across the base and every bank, so SWITCH_SLOT
# is live-safe: the CPU runs from the (unchanging) KERNAL half across the swap.
#
# A bank is PURE code + rodata: it is served ROM, so it cannot hold writable
# state at $A000-$BFFF (reads come from the served image, writes fall through to
# the C64 RAM under the ROM -- inconsistent). Any state a bank needs lives in
# C64 RAM outside $A000-$BFFF via absolute addresses, exactly as the timed
# loader already uses fixed page-2/3/ZP scratch.
#
# Bank code may only call the STATIC half: the KERNAL stubs ($FFD2 CHROUT, etc.),
# the iec_*/screen primitives and the SVC jump table -- never base BASIC-half
# routines, which are swapped out while the bank is served. Same discipline the
# RAM overlays already follow.
#
# ABI: the first bytes of the bank are a JMP table at $A000 (one entry per bank
# command); the resident dispatcher JSRs $A000 + 3*index after switching the
# served slot to this bank.
MEMORY {
    BANK: file = %O, start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
}
SEGMENTS {
    ENTRY:  load = BANK, type = ro;                 # the $A000 JMP table, linked first
    CODE:   load = BANK, type = ro;
    RODATA: load = BANK, type = ro, optional = yes;
}
