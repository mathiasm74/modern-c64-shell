# ef_spike.cfg - the EasyFlash proof-of-mechanism cart (PLAN.md section 7).
#
# Three 8KB images, one per flash chip/bank slot the .crt will carry. An EF bank
# is 16KB = an 8KB ROML chip plus an 8KB ROMH chip, and the two are addressed
# differently depending on the memory configuration -- bank 0's ROMH is at $E000
# in Ultimax (where the machine starts) and at $A000 in 16K mode.
MEMORY {
    # Bank 0 ROML: $8000, always mapped in 16K. Carries the CBM80 and the spike.
    ROML0:      file = "build/ef/roml0.bin", start = $8000, size = $2000,
                type = ro, fill = yes, fillval = $FF;
    # Bank 0 ROMH, linked for its ULTIMAX address so the start-up code and the
    # reset vectors resolve correctly. The marker at the start of it is what is
    # seen at $A000 once we are in 16K mode.
    ROMH0:      file = "build/ef/romh0.bin", start = $E000, size = $1F00,
                type = ro, fill = yes, fillval = $FF;
    ROMH0_BOOT: file = "build/ef/romh0.bin", start = $FF00, size = $00FA,
                type = ro, fill = yes, fillval = $FF;
    ROMH0_VEC:  file = "build/ef/romh0.bin", start = $FFFA, size = $0006,
                type = ro, fill = yes, fillval = $FF;
    # Bank 1 ROMH: $A000 in 16K mode. Marker only -- proving $DE00 works is the
    # entire job of this bank.
    ROMH1:      file = "build/ef/romh1.bin", start = $A000, size = $2000,
                type = ro, fill = yes, fillval = $FF;
}
SEGMENTS {
    ROML0:      load = ROML0,      type = ro;
    ROMH0:      load = ROMH0,      type = ro;
    ROMH0_BOOT: load = ROMH0_BOOT, type = ro;
    ROMH0_VEC:  load = ROMH0_VEC,  type = ro;
    ROMH1:      load = ROMH1,      type = ro;
}
