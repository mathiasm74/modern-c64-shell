# edit_bank.cfg - ld65 config for the EDIT BANK (docs/ROM-EXPANSION.md).
#
# The editor, which OUTGREW the RAM overlay region: code+rodata reached 5783
# bytes against the 5376 that fit between $8800 and the bank RAM, and adding the
# BASIC detokenizer pushed it past what $8800-$9FFF can hold at all once its BSS
# and C stack are counted. As a bank it has the full 8KB window with room to
# spare for the tokenizer, and it stops consuming user RAM for its code.
#
# RAM layout is the SAME window as the other banks ($9D00-$9FFF) -- one bank is
# served at a time and each re-initializes its own RAM on entry, so they share
# it and adding a bank costs no further program space. The document buffer is
# NOT here: it lives at $0800 in user RAM (BUF in edit.c), as it always did.
MEMORY {
    ZP:     file = "",                start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,                start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    DATARUN:file = "",                start = $9D00, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",                start = $9D10, size = $0100, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;                          # $A000 identity + JMP table
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
