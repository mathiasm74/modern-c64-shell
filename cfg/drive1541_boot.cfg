# drive1541_boot.cfg - the stage-1 bootstrap (src/drive1541_boot.s), linked to
# run at $0400 in DRIVE RAM: buffer 1, clear of the loader it fetches into
# $0500-$06FF and of the BAM in buffer 4. Raw blob, M-W'd up by the host.
MEMORY {
    BOOT: file = %O, start = $0400, size = $0100, type = rw, fill = no;
}
SEGMENTS {
    DRIVEBOOT: load = BOOT, type = rw;
}
