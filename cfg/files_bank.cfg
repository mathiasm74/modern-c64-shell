# files_bank.cfg - ld65 config for the FILES BANK (docs/ROM-EXPANSION.md).
#
# The third bank, and the one that retires the biggest RAM overlay. It carries
# the file/config/memory commands (src/banks/files.c) AND the colour picker
# (src/banks/picker.c) -- the picker has to come along, because `border`/`bg`/
# `text` with no value open it, and a bank cannot fetch a RAM overlay (the
# fetch machinery is resident BASIC-half code, swapped out while a bank runs).
#
# RAM layout is deliberately the SAME window as the disk bank ($9D00-$9FFF).
# Only one bank is served at a time and each re-initializes its own RAM on every
# entry, so banks SHARE this window rather than each taking a slice: adding a
# bank costs no further program space. $9CFF stays the ceiling for a loaded
# program however many banks exist.
MEMORY {
    ZP:     file = "",                start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,                start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    DATARUN:file = "",                start = $9D00, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",                start = $9D10, size = $0080, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;                          # $A000 identity + JMP table
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
