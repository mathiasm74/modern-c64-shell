# overlay_about.cfg - ld65 config for the about overlay (tardis, backlog #4).
#
# A self-contained multi-page ASM overlay running at $8800 (like dir/edit/files
# share that region), but pure assembly: it only clears the screen and prints
# its embedded text through CHROUT, so no cc65 runtime, zeropage or BSS is
# linked. `define = yes` on OVL exports __OVL_START__/__OVL_LAST__, which the
# header uses to compute its own page count for the multi-page fetch loop.
MEMORY {
    OVL: file = %O, start = $8800, size = $1500, define = yes;
}
SEGMENTS {
    CODE:   load = OVL, type = ro;
    RODATA: load = OVL, type = ro, optional = yes;
}
