# ef_util_bank.cfg - the UTIL BANK, linked for the EasyFlash target.
#
# Identical to cfg/util_bank.cfg except for where the writable state lives. On
# EasyFlash the bank is still served at $A000-$BFFF, but $8000-$9FFF is ROML --
# a write there lands in the RAM underneath while the read comes back from
# flash, so the One ROM build's $9D00-$9FFF window would be write-only. The
# window moves into $C800-$CDFF, between the shell's C stack and the $CE00
# completion cache; src/ef/platform.s carries the full map of that page.
#
# This bank binds nothing outside its own image but `_line`, which is why it is
# the one that ports with no source changes at all.
MEMORY {
    ZP:     file = "",  start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    DATARUN:file = "",  start = $C800, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",  start = $C810, size = $0100, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;          # $A000 identity + JMP table (first)
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
SYMBOLS {
    # Pinned by cfg/ef_rom.cfg's LINEBUF, same address as the One ROM build so
    # the completion matcher's absolute,X indexing needs no change.
    _line: type = export, value = $C000;
}
