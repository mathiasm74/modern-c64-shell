# rom.cfg - ld65 linker configuration for the C64 Shell ROM.
#
# Produces two 8KB binaries that together form the 16KB ROM:
#   build/basic.bin  -> $A000-$BFFF  (shell code; empty $FF filler in Phase 0)
#   build/kernal.bin -> $E000-$FFFF  (reset, IRQ/NMI stubs, hardware vectors)
#
# The 6510 resets through the vector at $FFFC, which lives in the KERNAL area,
# so all Phase 0 code lands in the KERNAL segment. The BASIC area is reserved
# for the C shell starting in Phase 4.

MEMORY {
    BASIC:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/basic.bin";
    KERNAL: start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/kernal.bin";
}

SEGMENTS {
    # Reserved for the shell (Phase 4+). Optional so Phase 0 links with it empty.
    BASICCODE: load = BASIC,  type = ro, optional = yes;

    CODE:      load = KERNAL, type = ro;
    RODATA:    load = KERNAL, type = ro, optional = yes;

    # KERNAL entry points pinned to their published addresses (JMP = 3 bytes).
    STUB_CHROUT: load = KERNAL, type = ro, start = $FFD2;
    STUB_GETIN:  load = KERNAL, type = ro, start = $FFE4;

    # 6502 hardware vectors must sit at the very top of memory.
    VECTORS:   load = KERNAL, type = ro, start = $FFFA;
}
