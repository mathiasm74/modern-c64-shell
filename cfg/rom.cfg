# rom.cfg - ld65 linker configuration for the C64 Shell ROM.
#
# Produces two 8KB binaries that together form the 16KB ROM:
#   build/basic.bin  -> $A000-$BFFF  (cc65 output: the C shell + runtime)
#   build/kernal.bin -> $E000-$FFFF  (hand-written core: reset, IRQ, stubs)
#
# Phase 4 splits the address space by who writes the code:
#   - Hand-written assembly (reset, IRQ, screen, KERNAL stubs, the C-call
#     shims in c_io.s) uses the KCODE segment and lands in the KERNAL ROM.
#   - Everything cc65 emits keeps its default segment names (CODE, RODATA,
#     DATA, BSS, ZEROPAGE) and lands in the BASIC ROM / RAM / zero page.
# This matches the documented memory map: "$A000-$BFFF shell code (cc65
# output)", "$E000-$FFFF KERNAL ROM (init, IRQ, stubs)".

MEMORY {
    # cc65 zero-page pseudo-registers (26 bytes; see asminc/zeropage.inc).
    # $1C-$1F stay free; everything the hand-written core uses sits at $A0+.
    ZP:     file = "",                 start = $0002, size = $001A, type = rw;

    # Shell working RAM: BSS/DATA grow up from $C000, the cc65 C stack grows
    # down from the top ($D000). 4KB is far more than the skeleton needs.
    # We carve $C800-$CDFF (1536 bytes) out of the top half for the RBCP
    # library's runtime location (see RBCP_RAM below); BSS plus cc65's stack
    # stay clear of it.
    # The shell's edit buffer is pinned at a FIXED address ($C000) because the
    # util bank's tab completion indexes it directly (absolute,X throughout the
    # matcher). Ordinary BSS moves between builds, which a separately-linked
    # bank cannot chase; cfg/util_bank.cfg binds _line to this same address.
    LINEBUF: file = "", define = yes,   start = $C000, size = $0060, type = rw;
    RAM:    file = "",  define = yes,   start = $C060, size = $07A0, type = rw;

    # Run-time location for the RBCP library. The library is loaded into
    # KERNAL ROM (RBCP_CODE segment) but linked to RUN at this address; a
    # ROM-side trampoline copies it here on demand before the bank swap.
    # 1.5 KB is comfortable for the ~600 bytes of compiled library plus our
    # own trampoline that calls it.
    RBCP_RAM: file = "", define = yes,  start = $C800, size = $0600, type = rw;

    BASIC:  file = "build/basic.bin",  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    KERNAL: file = "build/kernal.bin", start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    # cc65 runtime pseudo-registers (sp, ptr1, tmp1, ...), imported by the C.
    ZEROPAGE:    load = ZP,     type = zp;

    # Hand-written core -> KERNAL ROM. reset.s is linked first so `reset`
    # sits at $E000, where the reset vector points.
    KCODE:       load = KERNAL, type = ro;

    # RBCP library (One ROM Bus Control Protocol) -> stored in KERNAL ROM
    # but linked to *run* from RBCP_RAM at $C800. A trampoline in KCODE
    # (_rbcp_launch_stock) copies it into place at runtime; the library's
    # self-modifying code and the fact that the ROM under the CPU vanishes
    # mid-call both require it to live in RAM by then.
    RBCP_CODE:   load = KERNAL, run = RBCP_RAM, type = ro, define = yes, optional = yes;

    # cc65 output: C functions + pulled-in runtime helpers, plus read-only
    # data (string literals) -> shell ROM.
    CODE:        load = BASIC,  type = ro;
    RODATA:      load = BASIC,  type = ro,  optional = yes;

    # Const data / code we explicitly relocate to the KERNAL ROM (which has
    # lots of slack) to keep the BASIC ROM from overflowing. Used via
    # `#pragma rodata-name(push, "RODATA2")` or `#pragma code-name(push,
    # "CODE2")` around the data / function in question.
    RODATA2:     load = KERNAL, type = ro,  optional = yes;
    CODE2:       load = KERNAL, type = ro,  optional = yes;

    LOWCODE:     load = BASIC,  type = ro,  optional = yes;
    ONCE:        load = BASIC,  type = ro,  optional = yes;
    STARTUP:     load = BASIC,  type = ro,  optional = yes;

    # Initialized writable data: stored in ROM, copied to RAM at boot
    # (reset.s calls copydata). Relocated to KERNAL ROM (slack side) so it
    # doesn't fight CODE+RODATA for the smaller BASIC ROM. cc65's copydata
    # follows the __DATA_LOAD__ symbol, so this is transparent at runtime.
    DATA:        load = KERNAL, run = RAM,  type = rw,  define = yes, optional = yes;

    # Uninitialized data: lives in RAM, zeroed at boot (reset.s calls zerobss).
    BSS:         load = RAM,    type = bss, define = yes, optional = yes;
    LINEBUF:     load = LINEBUF, type = bss, optional = yes;

    # KERNAL entry points pinned to their published addresses. ld65 processes
    # pinned (start=) segments in declaration order, so these must be listed
    # in ascending address order.
    #
    # (Removed: RTS stubs at stock implementation addresses $FC85..$FF81. Real
    # software runs under the STOCK ROMs after the run/runstock/cartridge swap,
    # not under this ROM, so they protected a case that can't occur -- and their
    # fixed addresses capped CODE2's growth at $FC85, fragmenting the upper
    # KERNAL ROM. Dropping them lets CODE2 grow contiguously to $FFBA.)
    #
    # Shell-services jump table for overlays (src/svc.s): IEC + Epyx routines
    # at fixed addresses so the dir overlay can call them. Pinned just below the
    # file-I/O stubs; caps CODE2's growth here (keep in sync with svc.h).
    SVC_TABLE:   load = KERNAL, type = ro, start = $FF80;

    # The official jump table. The file-I/O block ($FFBA SETLFS .. $FFCF
    # CHRIN) and the load/save block ($FFD5 LOAD, $FFD8 SAVE) are dense, so
    # each lives in a single multi-JMP segment.
    STUB_FILE_IO:   load = KERNAL, type = ro, start = $FFBA;
    STUB_CHROUT:    load = KERNAL, type = ro, start = $FFD2;
    STUB_LOAD_SAVE: load = KERNAL, type = ro, start = $FFD5;
    STUB_GETIN:     load = KERNAL, type = ro, start = $FFE4;

    # 6502 hardware vectors must sit at the very top of memory.
    VECTORS:     load = KERNAL, type = ro, start = $FFFA;
}
