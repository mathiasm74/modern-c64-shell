# overlay.cfg - ld65 config for tardis overlay modules (PLAN.md backlog #4).
#
# Each overlay is linked standalone to run at the overlay cache address
# ($CE00, the free RAM above the RBCP library's $C800-$CDFF region) and
# emitted as a raw binary padded to exactly one 256-byte page -- the unit
# the loader's SLOT_PEEK transport moves. The overlay's entry point is its
# first byte. No cc65 runtime is linked: overlays talk to the machine via
# the fixed KERNAL entry points (CHROUT $FFD2 etc.).
MEMORY {
    OVL: file = %O, start = $CE00, size = $0100, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:   load = OVL, type = ro;
    RODATA: load = OVL, type = ro, optional = yes;
}
