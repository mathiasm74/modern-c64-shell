# util_bank.cfg - ld65 config for the UTIL BANK (docs/ROM-EXPANSION.md).
#
# The second bank. Like the disk bank it is SERVED as ROM at $A000-$BFFF in
# place of the base set's BASIC half, so code+rodata live at $A000 and only
# writable state lives in RAM. It holds tab completion (src/complete.s),
# `about`, the `debug` matrix viewer -- all pure assembly with their state in
# page 2 -- plus the colour cluster (colour.c + picker.c), which is C.
#
# It was runtime-free until the colour cluster arrived, and that property was
# described here as taking NOTHING out of the program load area. It does not
# actually buy that: the window below is the SAME $9D00-$9FFF the disk and files
# banks already reserve, banks SHARE it (only one is served at a time and each
# re-inits its own RAM on entry), and the loaded program's ceiling is $9CFF
# whether this bank uses the window or not. What the runtime would have cost is
# per-entry init on the TAB keystroke path -- and crt0_util.s initialises only
# the C entries, so the assembly ones still jump straight in.
#
# _line and the KERNAL/SVC entry points are the only things it reaches outside
# its own image -- see SYMBOLS.
MEMORY {
    ZP:     file = "",  start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    DATARUN:file = "",  start = $9D00, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",  start = $9D10, size = $0100, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;          # $A000 identity + JMP table (first)
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
SYMBOLS {
    # The shell's edit buffer, PINNED at this address by cfg/rom.cfg (segment
    # LINEBUF) precisely so this bank can index it directly -- the completion
    # matcher uses absolute,X addressing throughout, and ordinary BSS moves
    # between builds. Keep the two in step.
    _line: type = export, value = $C000;
}
