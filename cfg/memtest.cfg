# memtest.cfg -- ld65 config for the standalone hardware-diagnostic ROM.
#
# Produces:
#   build/memtest-basic.bin  -> $A000-$BFFF (sentinel-filled, test bytes only)
#   build/memtest-kernal.bin -> $E000-$FFFF (test code + vectors + KRNL sentinel)
#
# BASIC bank is filled with $5A (not $00 or $FF) so any read of an
# unpinned address is obviously "not one of the test bytes".
# KERNAL bank is filled with $A5 for the same reason in the few gaps.
#
# All segments named MT_* are explicit one-or-few-byte placements at fixed
# addresses; the linker handles the layout.

MEMORY {
    BASIC:  file = "build/memtest-basic.bin",  start = $A000, size = $2000,
            type = ro, fill = yes, fillval = $5A;
    KERNAL: file = "build/memtest-kernal.bin", start = $E000, size = $2000,
            type = ro, fill = yes, fillval = $A5;
}

SEGMENTS {
    # All test code, label strings, jump table, helpers -> KERNAL bank.
    KCODE:    load = KERNAL, type = ro;

    # Pinned single-byte sentinels.
    # BASIC bank
    MT_A000:  load = BASIC,  type = ro, start = $A000;
    MT_A050:  load = BASIC,  type = ro, start = $A050;
    MT_A100:  load = BASIC,  type = ro, start = $A100;
    MT_A200:  load = BASIC,  type = ro, start = $A200;
    MT_A800:  load = BASIC,  type = ro, start = $A800;
    MT_B000:  load = BASIC,  type = ro, start = $B000;
    MT_B800:  load = BASIC,  type = ro, start = $B800;
    MT_BFFF:  load = BASIC,  type = ro, start = $BFFF;

    # KERNAL bank
    MT_EFFE:  load = KERNAL, type = ro, start = $EFFE;

    # 6502 hardware vectors -- must be at $FFFA-$FFFF.
    VECTORS:  load = KERNAL, type = ro, start = $FFFA;
}
