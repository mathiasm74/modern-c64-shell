# drive1541.cfg - the drive-side loader, linked to RUN IN DRIVE RAM.
#
# $0500 is buffer 2's page: the DOS is not using it once an M-E has taken the
# machine, and it leaves buffer 0 ($0300) free for the job queue's sector
# reads. The output is a raw blob the host M-W's up in chunks, so there is no
# header and nothing to relocate -- the addresses below ARE the drive's.
MEMORY {
    # To $06FF and no further: buffer 4 ($0700) holds the BAM. The code AND its
    # BSS have to fit, so overflowing here is a link error, not a dead drive.
    DRIVE: file = %O, start = $0500, size = $0200, type = rw, fill = no;
}
SEGMENTS {
    DRIVECODE: load = DRIVE, type = rw;
    DRIVEBSS:  load = DRIVE, type = bss;   # after the code, not uploaded
}
