# hex_bank.cfg - ld65 config for the HEX BANK (docs/ROM-EXPANSION.md).
#
# The hex editor. Written against this shell's own primitives (KERNAL shims for
# I/O, svc 12 for PETSCII->screen), so it carries no screen or printf library
# and stays small. Its document lives at $0800 in USER RAM, like the text
# editor's -- the whole file is held there, because a CBM drive has no cheap
# seek and a paged design would re-read from the start on every scroll.
#
# RAM layout is the SAME shared window as the other banks; only one bank is
# served at a time and each re-initializes its own RAM on entry.
MEMORY {
    ZP:     file = "",                start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,                start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    DATARUN:file = "",                start = $9D00, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",                start = $9D10, size = $0100, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;                          # $A000 identity + JMP table
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
SYMBOLS {
    # Resident display helper (src/svc.s svc 12): PETSCII -> screen code for
    # ANY byte. It lives in the KERNAL half, which stays mapped while this bank
    # is served, so the SVC table can reach it -- which is the whole point of
    # keeping the rule in one place instead of a table per bank.
    _svc_scr_display: type = export, value = $FFA4;
}
