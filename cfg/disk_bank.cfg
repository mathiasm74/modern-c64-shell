# disk_bank.cfg - ld65 config for the DISK BANK (docs/ROM-EXPANSION.md, the
# cluster move). Unlike the RAM overlays (cfg/overlay_*.cfg link cc65 C to run
# from $8800 RAM), a bank's code is SERVED as ROM at $A000-$BFFF in place of the
# base set's BASIC half -- so the code+rodata live at $A000, and only the
# writable state (bss, the C data stack, and copied-down DATA) lives in RAM.
#
# The RAM it uses is the $8800-$9FFF user-RAM region the overlays used to run
# from: since a bank runs from ROM instead, that whole region is free for the
# bank's data. Layout mirrors overlay_dir.cfg, only CODE/RODATA move to $A000:
#
#   $A000-$BFFF  ENTRY (JMP table) + CODE + RODATA (served ROM)
#   $9D70-$9D7F  DATA run location (initialized writable globals, copied here
#                from ROM by the crt0's copydata at each bank entry)
#   $9D80-$9DFF  BSS (zeroed by the crt0 at entry)
#   $9E00-$9FFF  the bank's cc65 C data stack (crt0 points sp at $A000, grows
#                down) -- 512 bytes
#
# $9D70 is therefore the ceiling for a loaded program: everything below is the
# user's, everything from there up belongs to the bank while it runs. This
# window shrank (it used to start at $9C00) when the 256-byte Epyx descramble
# table stopped being generated into BSS and was assembled into the bank's ROM
# instead -- bank ROM is spare, bank RAM costs program space.
#   $40-$5F      the bank's cc65 zeropage block, disjoint from the shell's ($02-$1F)
#
# The base reaches the bank ONLY through the $A000 JMP table (bank_call in
# launch.s SWITCH_SLOTs to the bank, then JSRs $A000 + 3*entry). The bank reaches
# the machine through the resident KERNAL stubs ($FFD2 etc.) and the resident
# IEC services in the SVC table -- never base BASIC-half routines (swapped out).
MEMORY {
    ZP:     file = "",                start = $0040, size = $0020, type = rw, define = yes;
    BANK:   file = %O,                start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    # Packed high, right under BSS, NOT at $9800: this region is carved out of
    # the program load area, and `load`/`fload` now run FROM the bank, so a
    # program growing into it overwrites the bank's live C stack mid-transfer.
    # Keeping DATA/BSS/stack contiguous at the top costs the loadable area 1KB
    # ($9C00-$9FFF) instead of 2KB. See BANK_RAM_FLOOR in src/banks/disk_bank.c,
    # which must match this start and is what `load` refuses to cross.
    DATARUN:file = "",                start = $9D70, size = $0010, type = rw, define = yes;
    BANKBSS:file = "",                start = $9D80, size = $0080, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = BANK,  type = ro;                          # $A000 JMP table (first)
    CODE:     load = BANK,  type = ro;
    RODATA:   load = BANK,  type = ro, optional = yes;
    # The moved sources carry the shell's #pragma code-name/rodata-name(CODE2 /
    # RODATA2), which in the main ROM steer code into the KERNAL half when the
    # BASIC half is full. A bank has no such split -- it is one 8KB image -- so
    # both land in the same place. Mapped rather than stripped so the sources
    # stay byte-identical between their two builds.
    CODE2:    load = BANK,  type = ro, optional = yes;
    RODATA2:  load = BANK,  type = ro, optional = yes;
    DATA:     load = BANK,  run = DATARUN, type = rw, define = yes, optional = yes;
    # define = yes emits __BSS_RUN__/__BSS_SIZE__, which the crt0's per-entry
    # zerobss needs. (It is the SEGMENT that carries the define; naming the
    # MEMORY area BANKBSS rather than BSS is what keeps the two sets of symbols
    # from colliding.)
    BSS:      load = BANKBSS, type = bss, define = yes, optional = yes;
}
SYMBOLS {
    # Resident IEC services (src/svc.s) at their fixed addresses. The Epyx
    # services move INTO this bank, so only the iec_* entries are bound here.
    _svc_iec_set_fa:   type = export, value = $FF80;
    _svc_iec_set_sa:   type = export, value = $FF83;
    _svc_iec_setname:  type = export, value = $FF86;
    _svc_iec_open:     type = export, value = $FF89;
    _svc_iec_status:   type = export, value = $FF8C;
    _svc_iec_chkin:    type = export, value = $FF8F;
    _svc_iec_getbyte:  type = export, value = $FF92;
    _svc_iec_close:    type = export, value = $FF95;
    _svc_iec_clrchn:   type = export, value = $FF98;

    # fastload.c and the moved `load` call the IEC primitives by their plain
    # names -- bind those straight to the same SVC slots. (Three of them, svc 9-11, replaced the Epyx services that the bank now
    # carries itself.)
    _iec_set_fa:       type = export, value = $FF80;
    _iec_setname:      type = export, value = $FF86;
    _iec_open:         type = export, value = $FF89;
    _iec_close:        type = export, value = $FF95;
    _iec_set_sa:       type = export, value = $FF83;
    _iec_status:       type = export, value = $FF8C;
    _iec_chkin:        type = export, value = $FF8F;
    _iec_getbyte:      type = export, value = $FF92;
    _iec_clrchn:       type = export, value = $FF98;
    _iec_set_fnadr:    type = export, value = $FF9B;
    _iec_set_fnlen:    type = export, value = $FF9E;
    _iec_command_raw:  type = export, value = $FFA1;
}
