# kload.cfg - the patch that goes INTO the served stock KERNAL's tape space.
#
# Linked as its own image, not as part of build/kernal.bin, for one practical
# reason: it needs its OWN copies of the Epyx receiver, sender and clock-wait,
# and those same sources are already linked into the shell (and into the disk
# bank). Three copies in one link would clash on every symbol. A separate link
# gives each copy its own namespace -- exactly how the banks solve it.
#
# The result is .incbin'd into the shell's KERNAL ROM as data (src/kload_blob.s)
# and SLOT_POKEd into the stock image before the swap.
#
# $F8E2-$FB8D is reachable only from the stock KERNAL's tape paths -- tape is a
# non-goal for this shell, so it is ours to take. docs/TAPE-SPACE.md has the
# evidence; tools/kernal_map.py regenerates it. Do not grow past the size below
# without re-reading that: $FB8E onward is live stock code.
MEMORY {
    KL: file = %O, start = $F8E2, size = $02AC, type = ro, fill = no;
}
SEGMENTS {
    KLOAD:  load = KL, type = ro;
}
