# ef_rom.cfg - Tardis for EasyFlash (PLAN.md section 7, phase 2).
#
# The layout maps one-to-one onto the One ROM build, which is why this is a port
# and not a rewrite:
#
#   One ROM                          EasyFlash
#   KERNAL half  $E000, always there  ROML  $8000, always there
#   BASIC half   $A000, swapped out   ROMH  $A000, bank 0
#   banks served at $A000             ROMH  $A000, banks 1..n
#
# ROML carries the platform: boot, the bank switch, the SVC table, and the
# screen/keyboard code hooked onto the RAM vectors. It must be IDENTICAL in
# every bank -- $DE00 banks both windows together (phase 1 found this the hard
# way), so the always-mapped half is only "always mapped" if each bank carries
# the same copy of it.
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;

    # The always-mapped half. Same image in every bank.
    ROML:   file = "build/ef/tardis-roml.bin", start = $8000, size = $2000,
            type = ro, fill = yes, fillval = $FF;

    # Bank 0's ROMH: the shell itself -- cc65 output, the equivalent of today's
    # BASIC half, and swapped out under a bank command exactly as it is now.
    # Bank 0's ROMH does double duty, which is why it is split. The machine
    # powers up in ULTIMAX, where ROMH sits at $E000-$FFFF and therefore supplies
    # the reset vector -- so the last 256 bytes carry the start-up, linked for
    # its Ultimax address. The rest is the shell at $A000. Areas writing to the
    # same file are concatenated in definition order, so the offsets line up.
    ROMH0:  file = "build/ef/tardis-romh0.bin", start = $A000, size = $1F00,
            type = ro, fill = yes, fillval = $FF;
    ROMH0_BOOT: file = "build/ef/tardis-romh0.bin", start = $FF00, size = $00FA,
            type = ro, fill = yes, fillval = $FF;
    ROMH0_VEC:  file = "build/ef/tardis-romh0.bin", start = $FFFA, size = $0006,
            type = ro, fill = yes, fillval = $FF;

    # Writable state. The stock KERNAL owns $90-$FF and pages 0-3, so the shell's
    # RAM sits where it does today.
    RAM:    file = "", start = $C060, size = $0EA0, type = rw, define = yes;
    # `line` is PINNED, because the completion matcher indexes it with
    # absolute,X and ordinary BSS moves between builds. Same address as the One
    # ROM build so the util bank needs no change.
    LINEBUF: file = "", start = $C000, size = $0060, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;

    EFBOOT:   load = ROML,  type = ro;                 # linked first: cold entry
    # The shared hand-written core -- screen.s, irq.s, iec.s, c_io.s -- keeps its
    # own segment name and simply lands in the always-mapped half here, exactly
    # as it lands in the KERNAL half on the One ROM build.
    KCODE:    load = ROML,  type = ro, optional = yes;
    # The SVC table: the banks' only door to the outside, so it must be in the
    # always-mapped half. On the One ROM build it is pinned at $FF80 because the
    # banks are linked against that address; here it is pinned in ROML and the
    # banks are relinked to match (phase 3).
    SVC_TABLE: load = ROML, type = ro, optional = yes;
    # The KERNAL entry shims. On this target $FFxx belongs to the stock KERNAL,
    # so these are NOT at their published addresses -- they come along only
    # because getin_impl lives among them. Phase 3 should split that out and drop
    # the rest, which is ~500 bytes of ROML doing nothing.
    STUB_FILE_IO:   load = ROML, type = ro, optional = yes;
    STUB_CHROUT:    load = ROML, type = ro, optional = yes;
    STUB_LOAD_SAVE: load = ROML, type = ro, optional = yes;
    STUB_GETIN:     load = ROML, type = ro, optional = yes;
    EFCODE:   load = ROML,  type = ro;
    EFRODATA: load = ROML,  type = ro, optional = yes;

    CODE:     load = ROMH0, type = ro;
    EFULTIMAX: load = ROMH0_BOOT, type = ro;
    EFVEC:     load = ROMH0_VEC,  type = ro;
    RODATA:   load = ROMH0, type = ro, optional = yes;
    # The dispatch table and its name strings: a bank follows those pointers, so
    # they must live in the ALWAYS-mapped half, same rule as RODATA2 today.
    RODATA2:  load = ROML,  type = ro, optional = yes;
    CODE2:    load = ROMH0, type = ro, optional = yes;

    DATA:     load = ROMH0, run = RAM, type = rw, define = yes, optional = yes;
    BSS:      load = RAM,   type = bss, define = yes, optional = yes;
    LINEBUF:  load = LINEBUF, type = bss, define = yes, optional = yes;
}
