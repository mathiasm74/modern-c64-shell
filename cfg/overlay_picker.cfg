# overlay_picker.cfg - ld65 config for the color-picker overlay (tardis).
#
# A cc65-compiled C overlay running standalone at $8800 (like dir/files/edit),
# but it only draws to the screen via CHROUT and reads keys via GETIN -- no IEC,
# so crt0_picker.s wires just k_chrout / k_getin and no svc_* symbols are bound.
MEMORY {
    ZP:     file = "", start = $0040, size = $0020, type = rw, define = yes;
    OVL:    file = %O, start = $8800, size = $1500, define = yes;
    OVLBSS: file = "", start = $9D00, size = $0200, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    CODE:     load = OVL,    type = ro;
    RODATA:   load = OVL,    type = ro, optional = yes;
    DATA:     load = OVL,    type = rw, optional = yes;
    BSS:      load = OVLBSS, type = bss, optional = yes;
}
