SYMBOLS {
    __STACKSIZE__: value = $0800, type = weak; # 2k stack
}

MEMORY {
    ZP:       start = $0002, size = $002A, define = yes;
    CPUSTACK: start = $0100, size = $0100;
    RAM:      start = $C000, size = $1000, define = yes;

    RBCP:     start = $E000, size = $0100, fill = yes, fillval = $00, file = %O, define = yes;  # RBCP command page (address reads)
    SHARED:   start = $E100, size = $0600, fill = yes, fillval = $00, file = %O, define = yes;  # RBCP back channel region (response writes)
    ROMLO:    start = $E700, size = $1000, fill = yes, fillval = $AA, file = %O, define = yes;
    ROMHI:    start = $F700, size = $0881, fill = yes, fillval = $AA, file = %O, define = yes;
	JMPTBL:   start = $FF81, size = $0079, fill = yes, fillval = $AA, file = %O, define = yes;
    VECTORS:  start = $FFFA, size = $0006, fill = yes, fillval = $AA, file = %O, define = yes;
}

SEGMENTS {
    RODATA:   load = SHARED,           type = ro,  define = yes;
    RAMCODE:  load = ROMHI, run = RAM, type = ro,  define = yes;      
	JMPTBL:   load = JMPTBL,           type = ro;
    VECTORS:  load = VECTORS,          type = ro;

    CODE:     load = ROMLO,            type = ro,  define = yes;  
    ONCE:     load = ROMLO,            type = ro,  optional = yes;
    DATA:     load = ROMLO, run = RAM, type = rw,  define = yes;
    BSS:      load = RAM,              type = bss, define = yes;
    HEAP:     load = RAM,              type = bss, optional = yes;  # must sit just below stack
    ZEROPAGE: load = ZP,               type = zp,  define = yes;
}

FEATURES {
    CONDES: segment = INIT,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
    CONDES: type = interruptor,
            segment = RODATA,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__;
}
